<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="875" viewBox="0 0 600 875" role="img" aria-labelledby="title">
<title id="title">Language distribution across owned public non-fork repositories, measured in bytes.</title><defs>
