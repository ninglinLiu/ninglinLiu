name: Refresh contribution atlas
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-profile.yml'
      - 'scripts/build_profile.py'
      - 'scripts/refresh_contributions.py'
  workflow_dispatch:
  schedule:
    - cron: '19 1 * * *'
permissions:
  contents: write
concurrency:
  group: profile-atlas
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public upstream contributions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/refresh_contributions.py
      - name: Build profile visuals and contribution index
        run: python scripts/build_profile.py
      - name: Commit refreshed evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/contributions.json assets/*.svg docs/OPEN_SOURCE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh upstream contribution atlas"
          git push
